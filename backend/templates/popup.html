<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सहकार साथी (Sahakar Sathi) | AI Voice Popup</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        /* Popup container */
        #ai-popup {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: min(880px, calc(100vw - 32px));
            height: min(740px, calc(100vh - 48px));
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.25), 0 0 0 1px rgba(28, 37, 54, 0.15);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            resize: both;
            min-width: 320px;
            min-height: 420px;
            border: 2px solid #1C2536;
        }

        /* Popup header */
        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: linear-gradient(135deg, #1C2536 0%, #111827 100%);
            color: #ffffff;
            cursor: move;
            user-select: none;
            border-bottom: 2px solid #0F172A;
        }

        .popup-title {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            color: #FBBF24;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .popup-badge {
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: #FDE68A;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .popup-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .popup-close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #ffffff;
            cursor: pointer;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            line-height: 1;
            transition: all 0.2s ease;
        }

        .popup-close-btn:hover {
            background: #EF4444;
            color: #ffffff;
            transform: scale(1.05);
        }

        /* Iframe container */
        .popup-content {
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            overflow: hidden;
            background: #ffffff;
        }

        #ai-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        .ai-trigger-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 22px;
            background: linear-gradient(135deg, #D97706 0%, #B45309 100%);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14.5px;
            font-weight: 600;
            box-shadow: 0 4px 18px rgba(217, 119, 6, 0.35);
            transition: all 0.3s ease;
            z-index: 9998;
            border: 1.5px solid #F59E0B;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-trigger-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(217, 119, 6, 0.45);
            background: linear-gradient(135deg, #B45309 0%, #92400E 100%);
        }

        @media (max-width: 768px) {
            #ai-popup {
                width: calc(100vw - 16px);
                height: calc(100vh - 24px);
                bottom: 12px;
                right: 8px;
                left: 8px;
                margin: 0 auto;
                resize: none;
            }

            .ai-trigger-button {
                bottom: 10px;
                right: 10px;
                padding: 10px 18px;
                font-size: 13.5px;
            }
        }
    </style>
</head>
<body>
    <div id="ai-popup">
        <div class="popup-header" id="ai-popup-header">
            <span class="popup-title">
                <span>🌾 सहकार साथी (Sahakar Sathi)</span>
                <span class="popup-badge">NCCT • SIH-26087</span>
            </span>
            <div class="popup-controls">
                <button class="popup-close-btn" id="close-btn" title="Close" aria-label="Close">×</button>
            </div>
        </div>
        <div class="popup-content">
            <iframe id="ai-frame" src="/ai/" allow="microphone; autoplay" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const popup = document.getElementById('ai-popup');
            const header = document.getElementById('ai-popup-header');
            const closeBtn = document.getElementById('close-btn');

            if (closeBtn && popup) {
                closeBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    popup.style.display = 'none';
                });
            }

            // Dragging functionality
            let isDragging = false;
            let currentX = 0, currentY = 0, initialX = 0, initialY = 0, xOffset = 0, yOffset = 0;

            if (header && popup) {
                header.addEventListener('mousedown', function(e) {
                    if (e.target === closeBtn || closeBtn.contains(e.target)) return;
                    initialX = e.clientX - xOffset;
                    initialY = e.clientY - yOffset;
                    isDragging = true;
                });

                document.addEventListener('mousemove', function(e) {
                    if (isDragging) {
                        e.preventDefault();
                        currentX = e.clientX - initialX;
                        currentY = e.clientY - initialY;
                        xOffset = currentX;
                        yOffset = currentY;
                        popup.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
                    }
                });

                document.addEventListener('mouseup', function() {
                    isDragging = false;
                });

                header.addEventListener('touchstart', function(e) {
                    if (e.target === closeBtn || closeBtn.contains(e.target)) return;
                    const touch = e.touches[0];
                    initialX = touch.clientX - xOffset;
                    initialY = touch.clientY - yOffset;
                    isDragging = true;
                }, { passive: true });

                document.addEventListener('touchmove', function(e) {
                    if (isDragging) {
                        const touch = e.touches[0];
                        currentX = touch.clientX - initialX;
                        currentY = touch.clientY - initialY;
                        xOffset = currentX;
                        yOffset = currentY;
                        popup.style.transform = `translate3d(${currentX}px, ${currentY}px, 0)`;
                    }
                }, { passive: true });

                document.addEventListener('touchend', function() {
                    isDragging = false;
                });
            }
        });
    </script>
</body>
</html>
